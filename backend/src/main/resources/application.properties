spring.application.name=backend

# backend/src/main/resources/application.properties
server.port=8080

# --- Oracle XE(Remote) ---
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@192.168.0.61:1521/XE
# (XE 11g라면) spring.datasource.url=jdbc:oracle:thin:@192.168.0.61:1521:XE
spring.datasource.username=farmday
spring.datasource.password=a123

# --- MyBatis ---
mybatis.mapper-locations=classpath*:mappers/**/*.xml
mybatis.type-aliases-package=com.farmday.test
mybatis.configuration.map-underscore-to-camel-case=false

# (Optional) SQL 로그가 필요하면 아래 주석 해제
# logging.level.com.farmday=DEBUG
# logging.level.org.mybatis=DEBUG

# === JWT 설정 ===
# 최소 32자 이상 아무 문자열로 만들어 줘야 함 (영문+숫자 섞어서)
jwt.secret=ThisIsAFarmdayJwtSecretKey_ChangeMe_123456

# Access Token 유효기간: 15분 (밀리초)
jwt.access-token-validity-in-ms=900000

# Refresh Token 유효기간: 7일 (밀리초)
jwt.refresh-token-validity-in-ms=604800000

# 관리자 가입용 인증코드 (마음대로 정해도 됨)
admin.signup.code=FARMDAY-ADMIN-1234


# ✅ DevTools 옵션(기본값이지만 명시 추천)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# MyBatis XML 등 리소스 경로를 추가 감시하고 싶다면:
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

app.frontend-url=http://localhost:5173

# 정적 리소스는 재시작 대신 브라우저 리로드(기본 제외 규칙 유지 가능)
# spring.devtools.restart.exclude=static/**,public/**,templates/**
